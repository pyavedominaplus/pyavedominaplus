[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyavedominaplus"
version = "0.2.0"
description = "Python SDK for AVE DominaPlus home automation systems"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [
  { name = "Klaas Weyermann", email = "spool-happy-thrive@duck.com" },
]
keywords = ["home-automation", "domina", "ave", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]
dependencies = [
    # ClientWSTimeout (used in client.connect) requires aiohttp >= 3.10
    "aiohttp>=3.11",
]

[project.urls]
Homepage = "https://github.com/pyavedominaplus/pyavedominaplus"
Issues = "https://github.com/pyavedominaplus/pyavedominaplus/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "black>=24.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
    "build>=1.0",
    "twine>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["pyavedominaplus*"]

[tool.coverage.run]
source = ["pyavedominaplus"]

[tool.mypy]
strict = true
packages = ["pyavedominaplus"]
