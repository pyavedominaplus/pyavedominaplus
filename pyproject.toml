[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyavedominaplus"
version = "0.2.1"
description = "Python SDK for AVE DominaPlus home automation systems"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"
authors = [
  { name = "Klaas Weyermann", email = "spool-happy-thrive@duck.com" },
]
keywords = ["home-automation", "domina", "ave", "websocket"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
]
dependencies = [
    # ClientWSTimeout (used in client.connect) arrived in aiohttp 3.10;
    # 3.11 is pinned because 3.10 deprecated the old float ws timeout
    # and only 3.11 settled the current signature.
    "aiohttp>=3.11",
    # XML from the webserver's HTTP endpoints is untrusted network input.
    # Home Assistant constrains this to ==0.7.1 and already ships it, so
    # this costs a Home Assistant install nothing.
    "defusedxml>=0.7.1",
]

[project.urls]
Homepage = "https://github.com/pyavedominaplus/pyavedominaplus"
Issues = "https://github.com/pyavedominaplus/pyavedominaplus/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "coverage>=7.0",
    "black>=24.0",
    "mypy>=1.0",
    # stubs so mypy --strict can see through defusedxml
    "types-defusedxml",
    # 0.16 widened ruff's default rule set; the code is clean against it
    "ruff>=0.16",
    "build>=1.0",
    "twine>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# the CLI scripts are importable so their shared modules can be tested
pythonpath = [".", "scripts"]

[tool.setuptools.packages.find]
include = ["pyavedominaplus*"]

[tool.coverage.run]
source = ["pyavedominaplus"]
# Lets a bare `coverage run` work; CI uses pytest-cov instead.
command_line = "-m pytest tests"

[tool.mypy]
strict = true
packages = ["pyavedominaplus"]
