name: Release and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g., 0.2.0)"
        required: true
        type: string

jobs:
  release:
    name: Release and Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pyavedominaplus
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = "[^"]*"/version = "${{ inputs.version }}"/' pyproject.toml

      - name: Update version in __init__.py
        run: |
          sed -i 's/__version__ = "[^"]*"/__version__ = "${{ inputs.version }}"/' pyavedominaplus/__init__.py

      - name: Verify changes
        run: |
          echo "=== pyproject.toml ==="
          grep "version =" pyproject.toml
          echo "=== __init__.py ==="
          grep "__version__" pyavedominaplus/__init__.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml pyavedominaplus/__init__.py
          git commit -m "Bump version to ${{ inputs.version }}"
          git tag v${{ inputs.version }}

      - name: Push changes and tags
        run: |
          git push origin main
          git push origin v${{ inputs.version }}

      - name: Build distribution
        run: |
          python -m build

      - name: Validate with twine
        run: |
          python -m twine check dist/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ inputs.version }}
          files: dist/*
          body: |
            # Release ${{ inputs.version }}

            ## Changes
            - See commit history for details

            ## Installation
            ```bash
            pip install pyavedominaplus==${{ inputs.version }}
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
